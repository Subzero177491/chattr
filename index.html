#in{flex:1;background:var(--in);color:var(--text);border:0;border-radius:8px;padding:12px;font:inherit;resize:none;max-height:120px}

#modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:9;padding:16px}

#box input{background:var(--in);color:var(--text);border:0;border-radius:8px;padding:11px;font:inherit;width:100%}
#box input[type=checkbox]{width:auto}

#box .go{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:600}

.chip{display:inline-block;background:var(--in);border-radius:12px;padding:3px 10px;margin:2px;font-size:13px}
@media(max-width:700px){#side{width:100%;border:0}#main{display:none}
body.chat #side{display:none}body.chat #main{display:flex}#back{display:block}}

 <aside id="side"><div id="brand">Chattr</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAqJTssJ6sQohOmun2qNPITL6iAUPrks60",authDomain:"chattr-9ab01.firebaseapp.com",databaseURL:"https://chattr-9ab01-default-rtdb.firebaseio.com",projectId:"chattr-9ab01",storageBucket:"chattr-9ab01.firebasestorage.app",messagingSenderId:"853196971316",appId:"1:853196971316:web:5d0f10e6005d9f47f0d961"};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS=["#5865f2","#3ba55d","#eb459e","#faa61a","#ed4245","#00a8fc","#9b59b6"],EM=["👍","❤️","😂","😮","😢","🔥"];
let db,auth,uid,me={},cur=null,chats={},members=[],users={},pres={},watched={},prevU={},prevReq={},first=true,first2=true,replyTo=null,authErr="";
let friends={},reqs={},blocks={},reads={},msgRef,typRef,metaRef,readRef,msgs=[],typers={};
let searchOn=false,sall=null,sres=[],pend=false,pendingAvatar;
const SV=()=>firebase.database.ServerValue;
const okAv=s=>/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s||"");
const okImg=okAv,okAud=s=>/^data:audio\/[a-z0-9.+-]+(;[^;,]+)*;base64,[A-Za-z0-9+\/=]+$/.test(s||"");
const avh=(n,c,img)=>`<div class="av" style="background:${c||COLORS[0]}">${okAv(img)?`<img src="${img}" alt="">`:esc((n||"?").trim()[0].toUpperCase())}</div>`;
const fmt=ts=>{const d=new Date(ts),t=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});return d.toDateString()===new Date().toDateString()?"Today at "+t:d.toLocaleDateString()+" "+t};
const ago=ts=>{const m=Math.floor((Date.now()-ts)/6e4);return m<1?"just now":m<60?m+"m ago":m<1440?Math.floor(m/60)+"h ago":new Date(ts).toLocaleDateString()};
const user=id=>users[id]||{name:"Someone",color:COLORS[0]};
async function loadUser(id){if(!users[id]||!users[id].name){const s=await db.ref("users/"+id).get();users[id]=s.val()||{name:"Someone",color:COLORS[0]}}return users[id]}
const online=id=>pres[id]&&pres[id].online;
const dmId=o=>"dm_"+[uid,o].sort().join("_").replace(/[^A-Za-z0-9_-]/g,"");
const detach=()=>[msgRef,typRef,metaRef,readRef].forEach(r=>r&&r.off());
function watch(id){if(!id||watched[id])return;watched[id]=1;
 db.ref("presence/"+id).on("value",s=>{pres[id]=s.val()||{};renderList();renderHead()});
 db.ref("users/"+id).on("value",s=>{if(!s.val())return;users[id]=s.val();if(id===uid){me=s.val();renderMe()}renderList();renderHead();renderMsgs()})}

const friendly=e=>({"auth/invalid-email":"That email address doesn’t look right.","auth/missing-password":"Enter your password.","auth/wrong-password":"Wrong email or password.","auth/invalid-credential":"Wrong email or password.","auth/user-not-found":"No account with that email.","auth/email-already-in-use":"That email already has an account. Tap “I already have an account”.","auth/weak-password":"Password needs at least 6 characters.","auth/too-many-requests":"Too many tries. Wait a moment and try again.","auth/unauthorized-domain":"Add this site under Authorized domains in Firebase Authentication.","auth/operation-not-allowed":"That sign-in method isn’t enabled in Firebase yet.","auth/network-request-failed":"No connection. Check your internet."}[e.code]||e.message||"Something went wrong.");
async function boot(){
 firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth();
 try{await auth.getRedirectResult()}catch(e){authErr=friendly(e)}
 auth.onAuthStateChanged(async u=>{
  if(!u){uid=null;return showAuth(authErr)}
  if(uid&&u.uid!==uid){location.reload();return}
  if(uid)return;uid=u.uid;
  const s=await db.ref("users/"+uid).get();
  if(s.exists()){me=s.val();users[uid]=me;$("#modal").classList.remove("on");start()}else pickName();
 });
}
function showAuth(msg){
 const up=!!(auth.currentUser&&auth.currentUser.isAnonymous);let create=up;
 $("#box").innerHTML=`<b style="font-size:18px">${up?"Secure your account":"Sign in to Chattr"}</b>${up?`<small style="color:var(--mute)">Link a sign-in so you never lose your chats, even if you clear your browser.</small>`:""}
 <button class="go" id="gg" style="background:#fff;color:#333;border:1px solid var(--line)">Continue with Google</button>
 <input id="em" type="email" placeholder="Email" autocomplete="email" autocapitalize="off"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
 <div class="err" id="ae">${esc(msg||"")}</div><button class="go" id="si"></button>
 <button class="row" id="su" style="justify-content:center"></button><button class="row" id="fp" style="justify-content:center;font-size:13px">Forgot password?</button>
 <button class="row" id="alt" style="justify-content:center;font-size:13px">${up?"Not now":"Continue as guest"}</button>`;
 $("#modal").classList.add("on");
 const label=()=>{$("#si").textContent=create?"Create account":"Sign in";$("#su").textContent=create?"I already have an account":"Create a new account"};label();
 const err=t=>$("#ae").textContent=t,done=()=>{$("#modal").classList.remove("on");renderMe()};
 $("#su").onclick=()=>{create=!create;label()};
 $("#alt").onclick=()=>up?$("#modal").classList.remove("on"):auth.signInAnonymously().catch(e=>err(friendly(e)));
 $("#fp").onclick=async()=>{const m=$("#em").value.trim();if(!m)return err("Type your email first.");try{await auth.sendPasswordResetEmail(m);err("Password reset email sent.")}catch(e){err(friendly(e))}};
 $("#si").onclick=async()=>{const m=$("#em").value.trim(),p=$("#pw").value,cu=auth.currentUser;
  try{
   if(create){if(cu&&cu.isAnonymous){await cu.linkWithCredential(firebase.auth.EmailAuthProvider.credential(m,p));done()}else await auth.createUserWithEmailAndPassword(m,p)}
   else await auth.signInWithEmailAndPassword(m,p);
  }catch(e){err(friendly(e))}};
 $("#gg").onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider(),cu=auth.currentUser;
  try{if(cu&&cu.isAnonymous){await cu.linkWithPopup(p);done()}else await auth.signInWithPopup(p)}
  catch(e){
   if(e.code==="auth/credential-already-in-use"&&e.credential){try{await auth.signInWithCredential(e.credential)}catch(x){err(friendly(x))}}
   else if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)){cu&&cu.isAnonymous?cu.linkWithRedirect(p):auth.signInWithRedirect(p)}
   else if(!["auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code))err(friendly(e))}};
}
function renderMe(){
 const an=!!(auth.currentUser&&auth.currentUser.isAnonymous),bell=window.Notification&&Notification.permission==="default";
 $("#me").innerHTML=`<span>@${esc(me.name||"")}</span><span style="display:flex;gap:6px">${bell?`<button id="bell">🔔 Alerts</button>`:""}<button id="set" aria-label="Profile">⚙ Profile</button>${an?`<button id="sec">🔒 Secure</button>`:`<button id="so">Sign out</button>`}</span>`;
 if($("#bell"))$("#bell").onclick=async()=>{await Notification.requestPermission();renderMe()};
 $("#set").onclick=settings;
 if($("#sec"))$("#sec").onclick=()=>showAuth();
 if($("#so"))$("#so").onclick=()=>auth.signOut().then(()=>location.reload());
}
function pickName(msg){
 $("#box").innerHTML=`<b>Choose your username</b><input id="un" placeholder="letters, numbers, _" maxlength="20" autocapitalize="off"><div class="err">${msg||""}</div><button class="go" id="ok">Continue</button>`;
 $("#modal").classList.add("on");$("#ok").onclick=async()=>{
  const n=$("#un").value.trim(),k=n.toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(k))return pickName("3–20 letters, numbers or underscores.");
  const r=await db.ref("usernames/"+k).transaction(v=>v===null?uid:undefined);
  if(!r.committed)return pickName("That name is taken.");
  me={name:n,color:COLORS[Math.floor(Math.random()*COLORS.length)]};

function updateTitle(){let t=Object.keys(reqs).length;Object.values(chats).forEach(c=>t+=c.unread||0);document.title=(t?`(${t}) `:"")+"Chattr"}

 renderMe();watch(uid);
 db.ref(".info/connected").on("value",s=>{if(!s.val())return;const r=db.ref("presence/"+uid);
  r.onDisconnect().set({online:false,last:SV().TIMESTAMP}).then(()=>r.set({online:true,last:SV().TIMESTAMP}))});

 db.ref("friends/"+uid).on("value",async s=>{friends=s.val()||{};const ids=Object.keys(friends);await Promise.all(ids.map(loadUser));ids.forEach(watch);renderList()});
 db.ref("requests/"+uid).on("value",async s=>{reqs=s.val()||{};const ids=Object.keys(reqs);await Promise.all(ids.map(loadUser));
  if(!first2)ids.filter(i=>!prevReq[i]&&!blocks[i]).forEach(i=>{try{if(Notification.permission==="granted")new Notification("Friend request",{body:user(i).name+" wants to be friends"})}catch(e){}});
  prevReq=Object.fromEntries(ids.map(i=>[i,1]));first2=false;updateTitle();renderList()});
 db.ref("userChats/"+uid).on("value",async s=>{chats=s.val()||{};
  const others=Object.values(chats).filter(c=>c.other).map(c=>c.other);
  await Promise.all(others.map(loadUser));others.forEach(watch);
  for(const [id,c] of Object.entries(chats)){const n=c.unread||0;
   if(!first&&n>(prevU[id]||0)&&(id!==cur||document.hidden))notify(c,id);prevU[id]=n}

 const g=c.type==="group";$("#cn").textContent=(g?"👥 ":"")+title(c);let st="";

function renderList(){

  h+=arr.map(([id,c])=>{const g=c.type==="group",u=g?{}:user(c.other);
   return `<button class="row ${id===cur?"on":""}" data-c="${id}"><div class="avw">${avh(title(c),g?"#3ba55d":u.color,u.avatar)}${!g&&online(c.other)?'<i class="dot"></i>':""}</div><div class="tx"><b>${esc(title(c))}</b><small>${esc(c.last||"No messages yet")}</small></div>${c.unread?`<span class="bd">${c.unread>99?"99+":c.unread}</span>`:""}</button>`}).join("")}

 $("#list").innerHTML=h;$("#addg").style.display=Object.keys(friends).length?"":"none";renderHead();

async function send(text,img,extra){
 if(!cur)return;const c=chats[cur];
 if(c&&c.type==="dm"&&blocks[c.other])return alert("You blocked this person. Unblock them in chat options to send messages.");

 const ts=SV().TIMESTAMP,up={},k=db.ref(`chats/${cur}/messages`).push().key;
 const msg={uid,ts};if(text)msg.text=text.slice(0,2000);if(img)msg.img=img;if(extra)Object.assign(msg,extra);if(replyTo)msg.reply={name:replyTo.name,text:replyTo.text};
 const last=me.name+": "+(text?text.slice(0,50):extra&&extra.aud?"🎤 Voice message":"📷 Photo");
 up[`chats/${cur}/messages/${k}`]=msg;

 db.ref(`typing/${cur}/${uid}`).remove();replyTo=null;showReply();

// voice messages
const vdur=d=>{d=Math.round(d||0);return Math.floor(d/60)+":"+String(d%60).padStart(2,"0")};
let vplay=null,vid=null;
const flush=()=>{if(pend){pend=false;renderMsgs()}};
function playVoice(btn){
 const id=btn.dataset.v,m=findMsg(id);if(!m||!okAud(m.aud))return;
 if(vplay&&vid===id){vplay.paused?vplay.play():vplay.pause();return}
 if(vplay){const o=vplay;vplay=null;vid=null;o.pause()}
 const a=new Audio(m.aud),el=()=>document.querySelector(`.vp[data-v="${id}"]`),pl=()=>el()&&el().querySelector(".pl"),bar=()=>el()&&el().querySelector("i");
 vplay=a;vid=id;
 a.onplay=()=>{if(pl())pl().textContent="⏸"};
 a.onpause=()=>{if(pl())pl().textContent="▶";if(vplay===a)flush()};
 a.ontimeupdate=()=>{const d=m.dur||a.duration;if(d&&isFinite(d)&&bar())bar().style.width=Math.min(100,a.currentTime/d*100)+"%"};
 a.onended=()=>{if(bar())bar().style.width="0";if(pl())pl().textContent="▶";vplay=null;vid=null;flush()};
 a.onerror=()=>{vplay=null;vid=null;if(pl())pl().textContent="⚠";alert("This voice message can’t be played on this device. Clips recorded on one type of phone may not play on another older one.")};
 a.play().catch(()=>{});
}
let rec=null,recChunks=[],recT0=0,recTick=null,recStream=null,recBytes=0;
async function recStart(){
 if(!cur||rec)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return alert("This browser can’t record voice messages. Try Chrome, or Safari on iOS 14.3 or newer.");
 try{recStream=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){return alert(e.name==="NotAllowedError"?"The microphone is blocked. Allow the microphone for this site in your browser settings, then try again.":"Couldn’t start the microphone ("+e.name+").")}
 const mt=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(t=>MediaRecorder.isTypeSupported(t));
 try{rec=new MediaRecorder(recStream,Object.assign(mt?{mimeType:mt}:{},{audioBitsPerSecond:24000}))}
 catch(e){recStream.getTracks().forEach(t=>t.stop());rec=null;return alert("Recording isn’t supported here ("+e.name+").")}
 recChunks=[];recBytes=0;
 rec.ondataavailable=e=>{if(e.data&&e.data.size){recChunks.push(e.data);recBytes+=e.data.size;if(recBytes>265000)recStop(true)}};
 rec.start(500);recT0=Date.now();$("#recbar").classList.add("on");$("#rtime").textContent="🔴 0:00";
 recTick=setInterval(()=>{const s=Math.floor((Date.now()-recT0)/1000);$("#rtime").textContent="🔴 "+vdur(s);if(s>=45)recStop(true)},250);
}
function recStop(go){
 if(!rec)return;clearInterval(recTick);$("#recbar").classList.remove("on");
 const r=rec,dur=(Date.now()-recT0)/1000;rec=null;
 r.onstop=()=>{recStream.getTracks().forEach(t=>t.stop());if(!go||dur<1)return;
  const fr=new FileReader();
  fr.onload=()=>{const d=fr.result;if(!okAud(d)||d.length>385000)return alert("That recording couldn’t be sent (unsupported format or too long). Try a shorter one.");send("",null,{aud:d,dur:Math.round(dur)})};
  fr.onerror=()=>alert("Couldn’t read the recording.");
  fr.readAsDataURL(new Blob(recChunks,{type:r.mimeType||"audio/webm"}))};
 try{r.stop()}catch(e){recStream.getTracks().forEach(t=>t.stop())}
}
